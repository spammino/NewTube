name: Apply patch
on: workflow_dispatch
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - run: |
          for f in *.patch; do
            if git apply --check "$f" 2>/dev/null; then
              git apply "$f"
              echo "Applied $f"
            elif git apply --check -R "$f" 2>/dev/null; then
              echo "Already applied, skipping $f"
            else
              echo "Cannot apply $f"
              exit 1
            fi
            rm "$f"
          done
          git config user.name "patch-bot"
          git config user.email "patch-bot@users.noreply.github.com"
          git add -A
          git commit -m "Apply custom modifications"
          git push
